<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0a0b0d">
    <meta name="description" content="A read-only view of the Firstmate fleet: what needs the captain, live workers, the backlog, delivered work, and captured knowledge.">
    <title>Firstmate Fleet</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <div class="app" id="app" data-stale="false">
      <header class="vstrip" aria-label="Fleet verdict">
        <span class="vdot" id="vdot"></span>
        <span class="verdict" id="verdict">Waiting for the first snapshot</span>
        <div class="segbar" id="segbar" aria-hidden="true"></div>
        <span class="stalenote" id="stalenote" hidden><span class="g g-unknown"></span><span id="staleno-txt">data age unknown</span></span>
      </header>
      <div class="shell">
        <nav class="rail" aria-label="Primary">
          <div class="brand"><span class="bmark"></span><span class="btext">Firstmate</span></div>
          <button class="navitem" id="nav-needs" type="button" data-route="needs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><path d="M3.5 13h5l2 3h3l2-3h5"></path></svg>
            <span class="nlabel">Needs you</span>
            <span class="navbadge" id="navbadge" hidden>0</span>
          </button>
          <button class="navitem" id="nav-fleet" type="button" data-route="fleet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="4.4" height="15" rx="1"></rect><rect x="9.8" y="4.5" width="4.4" height="10" rx="1"></rect><rect x="16.1" y="4.5" width="4.4" height="7" rx="1"></rect></svg>
            <span class="nlabel">Fleet</span>
          </button>
          <button class="navitem" id="nav-backlog" type="button" data-route="backlog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h9"></path></svg>
            <span class="nlabel">Backlog</span>
          </button>
          <button class="navitem" id="nav-history" type="button" data-route="history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
            <span class="nlabel">History</span>
          </button>
          <button class="navitem" id="nav-knowledge" type="button" data-route="knowledge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M15.8 15.8L20 20"></path></svg>
            <span class="nlabel">Knowledge</span>
          </button>
          <div class="rail-actions">
            <button class="iconbtn" id="notify-button" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2.2 2.2 0 0 0 4 0"></path></svg>
              <span class="nlabel">Alerts off</span>
            </button>
            <button class="iconbtn" id="theme-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17M12 3.5a8.5 8.5 0 0 1 0 17" ></path></svg>
              <span class="nlabel">Light mode</span>
            </button>
          </div>
        </nav>
        <main class="main" id="view" tabindex="-1"></main>
      </div>
      <nav class="tabbar" aria-label="Primary">
        <button class="tabitem" id="tab-needs" type="button" data-route="needs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><path d="M3.5 13h5l2 3h3l2-3h5"></path></svg>
          Needs you
          <span class="tabbadge" id="tabbadge" hidden>0</span>
        </button>
        <button class="tabitem" id="tab-fleet" type="button" data-route="fleet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="4.4" height="15" rx="1"></rect><rect x="9.8" y="4.5" width="4.4" height="10" rx="1"></rect><rect x="16.1" y="4.5" width="4.4" height="7" rx="1"></rect></svg>
          Fleet
        </button>
        <button class="tabitem" id="tab-backlog" type="button" data-route="backlog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h9"></path></svg>
          Backlog
        </button>
        <button class="tabitem" id="tab-history" type="button" data-route="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          History
        </button>
        <button class="tabitem" id="tab-knowledge" type="button" data-route="knowledge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M15.8 15.8L20 20"></path></svg>
          Knowledge
        </button>
      </nav>
    </div>
  </body>
</html>
